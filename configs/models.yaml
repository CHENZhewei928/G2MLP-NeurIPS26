# Per-dataset teacher and student model settings.
# Derived from GLNN (Copyright Snap Inc. 2021, MIT License, see LICENSE).
# `global` holds the shared defaults; each dataset block overrides them per model.
# GPS uses dense attention, which needs O(N^2) memory: pubmed and a-computer
# need a large GPU, or set attn_mode to sparse to use less memory.

global:
  num_layers: 2
  hidden_dim: 128
  dropout_ratio: 0
  norm_type: none
  learning_rate: 0.01
  weight_decay: 0.0005
  batch_size: 512
  fan_out: 5,5
  num_workers: 0
  max_epoch: 200
  patience: 50
cora:
  SAGE:
    fan_out: 5,5
    learning_rate: 0.01
    dropout_ratio: 0
    weight_decay: 0.0005
  GCN:
    hidden_dim: 64
    dropout_ratio: 0.8
    weight_decay: 0.001
  MLP:
    learning_rate: 0.01
    weight_decay: 0.005
    dropout_ratio: 0.6
  GAT:
    dropout_ratio: 0.6
    weight_decay: 0.01
    num_heads: 8
    attn_dropout_ratio: 0.3
  GT:
    max_epoch: 500
    num_layers: 4
    hidden_dim: 128
    learning_rate: 0.005
    weight_decay: 0.0005
    dropout_ratio: 0.6
    attn_dropout_ratio: 0.3
    num_heads: 4
    pe_dim: 8
  GPS:
    max_epoch: 500
    num_layers: 4
    hidden_dim: 128
    learning_rate: 0.001
    weight_decay: 0.0005
    dropout_ratio: 0.6
    attn_dropout_ratio: 0.3
    num_heads: 4
    pe_dim: 8
    attn_mode: dense
  NAG:
    max_epoch: 500
    num_layers: 4
    hidden_dim: 128
    learning_rate: 0.001
    weight_decay: 0.0005
    dropout_ratio: 0.5
    attn_dropout_ratio: 0.3
    num_heads: 4
    K: 10
